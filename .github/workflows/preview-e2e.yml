name: preview-e2e
run-name: Preview E2E ${{ inputs.source_run_id }}/${{ inputs.source_run_attempt }}

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 成功した preview-deploy run ID
        required: true
        type: string
      source_run_attempt:
        description: preview-deploy の最新 attempt
        required: true
        type: string
      pr_number:
        description: 対象 PR 番号
        required: true
        type: string
      head_sha:
        description: 対象 PR の完全 head SHA
        required: true
        type: string
      deployment_id:
        description: Cloudflare 公式 API で確認した Preview deployment ID
        required: true
        type: string

permissions: {}

concurrency:
  group: preview-e2e-pr-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      head_sha: ${{ steps.target.outputs.head_sha }}
      deployment_url: ${{ steps.target.outputs.deployment_url }}
    steps:
      - name: 信頼済み ref のみ受け付ける
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: target
        name: PR・deploy 成功・公式 URL と version を照合
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/preview/run.mjs verify
      - uses: actions/upload-artifact@v4
        with:
          name: preview-target-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/preview-target.json
          retention-days: 7

  e2e:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}
          persist-credentials: false
      - name: 実 checkout SHA の照合
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - name: 実 Preview で UI E2E
        env:
          BUZZROOM_E2E_BASE_URL: ${{ needs.prepare.outputs.deployment_url }}
        run: npm run test:e2e
      - name: 非秘密の UI E2E 結果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-e2e-${{ inputs.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/e2e.json
          if-no-files-found: ignore
          retention-days: 7

  verify-after:
    needs: [prepare, e2e]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 実行後も同じ PR head と Preview version か照合
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/preview/run.mjs verify
      - name: E2E 成功を照合
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
        run: test "$E2E_RESULT" = success

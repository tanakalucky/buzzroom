name: preview-e2e-dispatch

on:
  workflow_run:
    workflows: [preview-deploy]
    types: [completed]

permissions: {}

concurrency:
  group: preview-e2e-dispatch-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.id == github.repository_owner_id &&
      github.event.workflow_run.triggering_actor.id == github.repository_owner_id
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      # PR のコード・依存関係を実行しない。workflow と同じ信頼済み default branch SHA。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 完了した Preview を照合して GitHub API で E2E を起動
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/preview/run.mjs dispatch

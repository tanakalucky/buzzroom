name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # main の run は本番 deploy を含むため、後続 push で途中キャンセルしない。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: 検証対象 SHA の照合
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          printf 'head=%s\nbase=%s\nrun=%s/%s/actions/runs/%s/attempts/%s\n' "$actual_sha" "$BASE_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python3 -m unittest discover -s .ai-config/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run fmt:check
      - run: npm run typegen
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: UI E2E の非秘密結果を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: test-results/e2e.json
          if-no-files-found: ignore
          retention-days: 7

  # main への push で verify が成功したときだけ本番へ deploy する。
  deploy-production:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 依存関係のインストール
        run: npm ci

      - name: 本番用の build
        run: npm run build

      - name: 本番の deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # アプリが固定している cf を使い、上で build した Build Output をそのまま deploy する。
        run: npx --no-install cf deploy --prebuilt

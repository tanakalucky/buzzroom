# PR ごとの Worker Preview の作成・更新。削除は preview-cleanup が行う。
# 信頼モデル: 本人が管理する PR 専用。build と deploy が同じ job のため、PR の build コードは
# deploy step の secret に影響しうる(受け入れ済み。secret の隔離は主張しない)。
# pull_request の workflow は PR 側の定義で動くため、下の条件も PR 側で書き換えられる。
name: preview-deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}

jobs:
  deploy:
    # owner 本人が起動・再実行した、同一リポジトリの PR だけ動く。PR 作者名や commit author は見ない。
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.actor_id == github.repository_owner_id
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 依存関係のインストール
        run: npm ci

      - name: Preview 用の build
        env:
          CLOUDFLARE_PREVIEW_BUILD: "true"
        run: npm run build

      - name: deploy 前の PR 状態確認
        id: pr_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_data="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}")"
          pr_state="$(echo "$pr_data" | jq -r '.state')"
          pr_head="$(echo "$pr_data" | jq -r '.head.sha')"
          if [ "$pr_state" != "open" ]; then
            echo "PR が閉じられているため、deploy をスキップします(state: $pr_state)" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$pr_head" != "${{ github.event.pull_request.head.sha }}" ]; then
            echo "PR の head が変わっているため、deploy をスキップします(現在: $pr_head、開始時: ${{ github.event.pull_request.head.sha }})" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

      - name: Preview の deploy
        if: steps.pr_check.outputs.should_deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # secret が空のまま cf CLI を実行すると未認証の一時アカウントフローに入りうるため、先に guard する。
        # アプリが固定している cf を使う。Preview 名は位置引数。
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN repository secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID repository secret}"
          npx --no-install cf previews deploy "$PREVIEW_NAME" --prebuilt
